plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// All jar files from this folder will be added automatically as runtime mod dependencies
def extraModsDir = "extra-mods"
def extraAPIDir = "extra-api"

repositories {
    mavenLocal()

    flatDir {
        name "extra-mods"
        dir file(extraModsDir)
    }

    flatDir {
        name "extra-api"
        dir file(extraAPIDir)
    }

    maven { //Patchouli && JEI
        url 'https://maven.blamejared.com'
        content {
            includeGroup "vazkii.patchouli"
            includeGroup "mezz.jei"
        }
    }

    //maven { // mek / AE2 — disabled during 26.1 port
    //    url = 'https://modmaven.dev/'
    //    content {
    //        includeGroup "mekanism"
    //        includeGroup "appeng"
    //    }
    //}

    maven { url = "https://www.cursemaven.com" } // curse mods (Curios)
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
        vendor.set(JvmVendorSpec.JETBRAINS)
    }
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            gameDirectory = file("runs/${name}")
            //if a JBR toolchain is selected, enable DCEVM hot-swap
            jvmArguments.add("-XX:+AllowEnhancedClassRedefinition")
        }

        client {
            client()
            programArguments.addAll '--username', 'Direwolf20'
        }

        client2 {
            client()
            programArguments.addAll '--username', 'Direwolf21'
        }

        server {
            server()
        }

        gameTestServer {
            type = "gameTestServer"
        }

        clientData {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated-client/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/generated-data/resources/').getAbsolutePath()
        }

        serverData {
            serverData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated-data/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath(),
                    '--existing', file('src/generated-client/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir 'src/generated-client/resources'
    srcDir 'src/generated-data/resources'
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    //AE2 — disabled during 26.1 port
    //compileOnly "appeng:appliedenergistics2-neoforge:${ae2_version}:api"
    //runtimeOnly "appeng:appliedenergistics2-neoforge:${ae2_version}"

    //Curios
    implementation "curse.maven:curios-309927:${curios_file_id}"

    // JEI
    compileOnly "mezz.jei:jei-${jei_mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_mc_version}-neoforge:${jei_version}"

    // Patchouli
    compileOnly "vazkii.patchouli:patchouli-neoforge:${patchouli_version}:api"
    localRuntime "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    // Mekanism — disabled during 26.1 port
    //compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}"// Mekanism
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:additions"// Mekanism: Additions
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:generators"// Mekanism: Generators
    //runtimeOnly "mekanism:Mekanism:${mekanism_version}:tools"// Mekanism: Tools

    addLocalArtifacts('localRuntime', extraModsDir)
    addLocalArtifacts('compileOnly', extraAPIDir, "extra-api")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version         : neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '10000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def addLocalArtifacts(type, dir, prefix = "extra-mods") {
    for (extraModJar in fileTree(dir: dir, include: '*.jar')) {
        def basename = extraModJar.name.substring(0, extraModJar.name.length() - ".jar".length())
        def versionSep = basename.lastIndexOf('-')
        assert versionSep != -1
        def artifactId = basename.substring(0, versionSep)
        def version = basename.substring(versionSep + 1)
        type "${prefix}:$artifactId:$version"
    }
}
